; Ajustes de PHP para produção (Render). Desenvolvimento continua usando os
; padrões do php.ini normal — este arquivo só existe na imagem de produção.

; OPcache: o código não muda dentro de um container em execução (cada deploy
; do Render sobe um container novo a partir de uma imagem nova), então
; validate_timestamps=0 é seguro e evita o custo de checar mtime de arquivo
; a cada requisição.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

; Erros nunca devem ser exibidos ao visitante; vão para o log (stderr, visível
; no painel do Render). APP_DEBUG=false já faz o Laravel esconder detalhes,
; isto é uma segunda camada no nível do próprio PHP.
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr

; A aplicação não tem upload de arquivos hoje; valores modestos são
; suficientes e evitam que o worker aceite payloads desnecessariamente grandes.
upload_max_filesize=8M
post_max_size=8M

memory_limit=256M
